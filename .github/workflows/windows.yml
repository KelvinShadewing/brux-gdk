name: Windows

on:
  push:
    branches: [main]
    paths:
      - "rte/**"
      - ".github/workflows/windows.yml"
  pull_request:
    branches: [main]
    paths:
      - "rte/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Install dependencies
        shell: pwsh
        run: |
          $packages = @(
            'pkgconf:x64-windows'
            'sdl2:x64-windows'
            'sdl2-image[libjpeg-turbo]:x64-windows'
            'sdl2-mixer[libflac,libmodplug,mpg123,opusfile]:x64-windows'
            'sdl2-net:x64-windows'
            'sdl2-gfx:x64-windows'
            'physfs:x64-windows'
            'curl:x64-windows'
          )

          vcpkg install $packages

      - name: Install Meson
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "meson>=1.0.1,<2" ninja

      - name: Configure, build, and stage
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere `
            -latest `
            -products '*' `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

          if (-not $vsPath) {
            throw 'Visual Studio C++ tools were not found'
          }

          $devShell = Join-Path $vsPath 'Common7\Tools\Launch-VsDevShell.ps1'
          & $devShell -Arch amd64 -HostArch amd64 -SkipAutomaticLocation

          if (-not (Get-Command cl.exe -ErrorAction SilentlyContinue)) {
            throw 'MSVC environment was not initialized'
          }

          $prefix = 'C:/vcpkg/installed/x64-windows'
          $env:CC = 'cl'
          $env:CXX = 'cl'
          $env:PKG_CONFIG = "$prefix/tools/pkgconf/pkgconf.exe"

          meson setup rte/build rte `
            --buildtype=release `
            "-Dcmake_prefix_path=$prefix" `
            "-Dpkg_config_path=$prefix/lib/pkgconfig;$prefix/share/pkgconfig"

          meson compile -C rte/build
          meson install -C rte/build --destdir "$env:GITHUB_WORKSPACE/dist"

          $brux = Get-ChildItem "$env:GITHUB_WORKSPACE/dist" `
            -Recurse -Filter brux.exe |
            Select-Object -First 1

          if (-not $brux) {
            throw 'Meson did not install brux.exe'
          }

          Copy-Item "$prefix/bin/*.dll" $brux.Directory.FullName -Force

      - name: Upload Windows build
        uses: actions/upload-artifact@v7
        with:
          name: Brux-Windows-x64-release
          path: dist
          if-no-files-found: error